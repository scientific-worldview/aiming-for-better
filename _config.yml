# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Aiming for Better
email: october-talisman@proton.me
author: "October Talisman"
description: >- # this means to ignore newlines until "baseurl:"
  Applying a scientific worldview to life's most challenging questions.
  We rigorously stress-test societal dilemmas, personal choices, and competing narratives using objective evidence, first principles, and our deep evolutionary history to guide you to clearer, more informed understanding and a path to human flourishing.
  Exploring the concepts and consequences of in-group versus out-group tribalism, narratives versus reality, mismatches between our evolved psychology/biology and the modern world, the lock-in effect of vested interests and other factors that perpetuate bad ideas, the pseudoscience that drives misinformation, and the importance of critical thinking and rational inquiry in navigating the complexities of the 21st century.
  A guide for "How to Think" not "What to Think".
  How should important decisions be made?
  A guide to critical thinking, rational inquiry, and true citizenship in the 21st century.
  Join us on a journey to better thinking, better choices, and a better world.
baseurl: "/aiming-for-better" # the subpath of your site, e.g. /blog
url: "https://scientific-worldview.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
theme: null
#plugins:
#  - jekyll-feed

markdown: kramdown
highlighter: rouge
permalink: pretty
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed


collections:
  guide:
    output: true
    permalink: /guide/:path/
  casestudies:
    output: true
    permalink: /case-studies/:path/
  articles:
    output: true
    permalink: /articles/:path/
  

defaults:

  - scope:
      path: "_posts"
    values:
      layout: post
      section: posts
      heading: "Blog Posts"
      permalink: /posts/:title/
  
  - scope:
      path: "_guide"
    values:
      layout: "page"
      section: "guide"
      heading: "Thinking Guide"
      intro: "Test guide intro"
      permalink: /guide/:path

  - scope:
      path: "_casestudies"
    values:
      layout: "page"
      section: "casestudies"
      heading: "Case Studies"
      intro: "Test case studies intro"
      permalink: /case-studies/:path

  - scope:
      path: "_articles"
    values:
      layout: "page"
      section: "articles"
      heading: "Asides and Tangents"
      permalink: /articles/:path
  
 
  



sass:
  sass_dir: _sass
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
