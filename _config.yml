#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

liquid:
  error_mode: lax
  # For BUILD:
  #error_mode: strict
  #strict_variables: true
  #strict_filters: true
